[image]
name = "cpp-lab"
release = "22.04"
arch = "amd64"

[user]
name = "student"
sudo = true

[wsl]
systemd = true
default_user = "student"

[locale]
lang = "en_US.UTF-8"
timezone = "UTC"

# Typo: [package] instead of [packages]. Must fail loudly, not silently build
# an image with an empty include list.
[package]
include = ["git", "build-essential", "cmake"]
