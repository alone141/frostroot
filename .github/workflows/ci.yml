name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # The same script CONTRIBUTING.md asks for before a push, so a clean
      # run on a laptop is a clean run here: gofmt, vet with and without the
      # integration tag, go test -race, and the Windows build. Lint has a job
      # of its own below.
      - name: gofmt, vet, test and the Windows build
        run: scripts/check.sh --only fmt,vet,test,windows

  integration:
    # The tests behind the integration tag bootstrap real images and compare
    # two builds of one lock byte for byte. Until this job existed CI only
    # vetted them, so the claim this project is built on — that an offline
    # rebuild is byte-identical — was checked by code nothing ran.
    name: Integration (real bootstrap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install mmdebstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap ubuntu-keyring
      # Every package's integration tests, and two checks a green summary
      # alone cannot give: that none of them skipped for want of a
      # prerequisite, and that each test the script names ran to a pass. The
      # script says why each is there, and runs the same way by hand.
      - name: Integration tests, and proof that they ran
        run: scripts/integration.sh

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2

  vulncheck:
    # The toolchain go.mod pins is the one setup-go installs here and in the
    # release workflow, so the binary people download is built with it. When
    # go.mod said 1.24.2, govulncheck reported 32 reachable vulnerabilities
    # in crypto/x509, crypto/tls, net/http, net/url, archive/tar,
    # encoding/asn1 and encoding/pem — the packages this project's security
    # rests on — and nothing in CI was looking.
    #
    # This job fails on a vulnerability the code can reach. A disclosure can
    # therefore turn an unrelated pull request red; that is the point, and
    # the fix is a toolchain bump rather than a wait.
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # govulncheck at a pinned version (@latest would make the meaning of a
      # red build depend on the day), against the toolchain go.mod pins,
      # which the step checks it really is running: a job that silently used
      # another toolchain would clear a check it never performed.
      - name: govulncheck
        run: scripts/check.sh --only vuln
