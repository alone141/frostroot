name: fuzz, weekly

# The fuzz targets' seed corpora run with every go test. This runs each
# target for a while, as scripts/check.sh --only fuzz does, against the
# parsers of what the network, a lock and a captured machine hand over. A
# crasher is uploaded; commit it under the package's testdata/fuzz, where it
# becomes a seed every go test runs. GitHub runs a scheduled workflow from
# the default branch.
on:
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz every target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: two minutes a target
        run: FROSTROOT_FUZZTIME=2m scripts/check.sh --only fuzz
      - name: keep what crashed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: internal/**/testdata/fuzz/
          if-no-files-found: ignore
