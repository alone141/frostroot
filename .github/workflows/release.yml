name: Release

# Pushing a tag such as v0.4.0 publishes a GitHub Release with a static
# linux/amd64 binary and its checksum. The tag must equal the version the
# binary reports, so a release never claims a version other than its tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check that the tag matches builder.Version
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/builder/builder.go)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match builder.Version $version"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Build a static binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o frostroot-linux-amd64 ./cmd/frostroot
      - name: Check the binary
        run: |
          ./frostroot-linux-amd64 version
          sha256sum frostroot-linux-amd64 > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "frostroot ${GITHUB_REF_NAME#v}" --generate-notes frostroot-linux-amd64 SHA256SUMS
